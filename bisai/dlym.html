<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅游新世界 - 登录页</title>
    <link rel="stylesheet" href="style-3.css">
</head>
<body>
<div class="page-box">
    <!-- 上半蓝色区域 -->
    <div class="top-blue">
        <div class="logo">旅游服务平台</div>
        <div class="top-left-text">
            <h1>登录账号</h1>
            <p class="text-desc">路线，轻松规划每一次出行，探索祖国大好</p>
        </div>
        <div class="rocket-decor"></div>
    </div>

    <!-- 下半白色区域 -->
    <div class="bottom-white">
        <div class="quick-user">
            <p>快捷登录账号</p>
            <div class="user-card-wrap">
                <!-- 张三 -->
                <div class="user-card">
                    <!-- 头像图片 -->
                    <img src="images/2.jpg" alt="张三头像" class="avatar">
                    <span class="username">张三</span>
                    <small>3天前活跃</small>
                </div>
                <!-- 李四 -->
                <div class="user-card">
                    <img src="images/1.jpg" alt="李四头像" class="avatar">
                    <span class="username">李四</span>
                    <small>5天前活跃</small>
                </div>
            </div>
        </div>

        <!-- 登录卡片：仅Y轴垂直居中，靠右摆放，不X轴居中 -->
        <div class="login-card">
            <div class="card-head">
                <div class="card-title">
                    <span>欢迎来到</span>
                    <strong>旅游新世界</strong>
                    <h2>登录</h2>
                </div>
                <div class="register-link">
                    暂无账号？<a href="#">立即注册</a>
                </div>
            </div>

            <div class="third-login">
                <button class="google-login">
                    <span class="g-icon"></span>账号快捷登录
                </button>
                <div class="icon-box">
                    <span class="fb-icon">是</span>
                    <span class="video-icon">否</span>
                </div>
            </div>

            <form class="login-form">
                <div class="input-item">
                    <label>请输入用户名/邮箱</label>
                    <input type="text" placeholder="用户名或邮箱地址">
                </div>
                <div class="input-item">
                    <label>请输入密码</label>
                    <input type="password" placeholder="密码">
                    <a href="#" class="forget-pwd">忘记密码</a>
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
